<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule - TwinFlow</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <script src="/js/theme.js"></script>
  <style>
    .schedule-progress {
      margin-bottom: 18px;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .progress-head strong {
      color: var(--text);
    }

    .progress-bar-shell {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.2s ease;
    }

    .schedule-item {
      align-items: flex-start;
    }

    .schedule-body-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      width: 100%;
    }

    .task-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 130px;
    }

    .task-actions .btn {
      width: 100%;
      font-size: 13px;
      padding: 8px 10px;
    }

    .task-personalization {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.16);
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .task-personalization strong {
      color: var(--text);
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border: 1px solid var(--border);
      color: var(--text-muted);
      background: var(--surface);
    }

    .task-done {
      background: rgba(16, 185, 129, 0.10);
      border-color: rgba(16, 185, 129, 0.25);
    }

    .task-done .title,
    .task-done .desc {
      color: var(--text-muted);
      text-decoration: line-through;
      text-decoration-thickness: 2px;
    }

    .task-done .status-chip {
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.30);
      background: rgba(16, 185, 129, 0.12);
    }

    .task-skipped {
      background: rgba(148, 163, 184, 0.12);
    }

    .task-skipped .title,
    .task-skipped .desc {
      color: var(--text-muted);
    }

    .task-skipped .status-chip {
      color: var(--text-muted);
      background: rgba(148, 163, 184, 0.16);
    }

    .task-rescheduled {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.25);
    }

    .task-rescheduled .status-chip {
      color: var(--warning);
      border-color: rgba(245, 158, 11, 0.30);
      background: rgba(245, 158, 11, 0.14);
    }

    .task-actions .btn.active {
      border-color: transparent;
      color: #fff;
    }

    .task-actions .btn.done.active {
      background: var(--success);
    }

    .task-actions .btn.skipped.active {
      background: #64748b;
    }

    .task-actions .btn.rescheduled.active {
      background: var(--warning);
      color: #1f2937;
    }

    @media (max-width: 820px) {
      .schedule-body-grid {
        grid-template-columns: 1fr;
      }

      .task-actions {
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <div class="animated-bg">
    <div class="orb orb-1"></div><div class="orb orb-2"></div>
    <div class="orb orb-3"></div><div class="orb orb-4"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    let currentSchedule = null;
    let currentStatus = { done: 0, skipped: 0, total: 0, completionPct: 0, statuses: [] };

    (async () => {
      const user = await requireAuth();
      if (!user) return;
      const main = renderLayout(user, 'schedule');
      main.innerHTML = `
        <div class="page-header">
          <div>
            <h1>AI Schedule</h1>
            <p>Personalized to your latest energy prediction and recent work habits.</p>
          </div>
          <button class="btn" id="regen">&#8635; Regenerate</button>
        </div>
        <div id="schedule-area"><div class="empty">Loading schedule...</div></div>
      `;
      document.getElementById('regen').onclick = () => load(true);
      await load(false);
    })();

    async function load(force) {
      const area = document.getElementById('schedule-area');
      try {
        currentSchedule = force
          ? await api.post('/api/schedule/generate')
          : await api.get('/api/schedule/today');
        currentStatus = await api.get('/api/schedule/today/status');
        render();
      } catch (err) {
        area.innerHTML = `
          <div class="empty">
            <h3>${err.message || 'No schedule yet'}</h3>
            <p>Log a daily entry first, then come back here.</p>
            <p style="margin-top: 14px;"><a class="btn" href="/log.html">Go to Daily Log</a></p>
          </div>`;
      }
    }

    function render() {
      const area = document.getElementById('schedule-area');
      area.innerHTML = renderSchedule(currentSchedule, currentStatus);
      bindTaskActions();
    }

    function bindTaskActions() {
      document.querySelectorAll('[data-task-action]').forEach(button => {
        button.addEventListener('click', async () => {
          const taskId = Number(button.dataset.taskId);
          const status = button.dataset.taskAction;
          try {
            currentStatus = await api.post(`/api/schedule/task/${taskId}/status`, { status });
            render();
          } catch (err) {
            showToast(err.message || 'Could not update task status', 'error');
          }
        });
      });
    }

    function renderSchedule(sched, statusSummary) {
      const zoneClass = sched.energyZone;
      const statuses = new Map((statusSummary.statuses || []).map(item => [item.taskId, item.status]));
      const pct = Number(statusSummary.completionPct || 0);

      return `
        <div class="row between fade-in" style="margin-bottom: 16px;">
          <div>
            <div class="energy-pill ${zoneClass}">
              ${sched.energyZone.toUpperCase()} ENERGY - ${sched.predictedEnergyLevel.toFixed(1)}/10
            </div>
          </div>
          <div style="font-size: 13px; color: var(--text-muted);">
            ${sched.totalWorkMinutes} min work - ${sched.totalBreakMinutes} min break
          </div>
        </div>

        <div class="card fade-in schedule-progress">
          <div class="progress-head">
            <div><strong>${statusSummary.done} of ${statusSummary.total} tasks completed - ${formatPercent(pct)}</strong></div>
            <div style="font-size: 13px; color: var(--text-muted);">
              ${statusSummary.skipped} skipped
            </div>
          </div>
          <div class="progress-bar-shell">
            <div class="progress-bar-fill" style="width: ${Math.max(0, Math.min(100, pct))}%;"></div>
          </div>
        </div>

        <div class="card fade-in">
          <h3 style="margin-bottom: 14px;">Today's Plan</h3>
          <div class="schedule-list">
            ${sched.tasks.map(task => renderTaskRow(task, statuses.get(task.id) || 'pending')).join('')}
          </div>
        </div>

        ${sched.recommendations.length > 0 ? `
          <div class="card fade-in" style="margin-top: 18px;">
            <h3 style="margin-bottom: 10px;">Recommendations</h3>
            ${sched.recommendations.map(item => `<div class="recommendation">${item}</div>`).join('')}
          </div>
        ` : ''}
      `;
    }

    function renderTaskRow(task, status) {
      const rowClass = {
        done: 'task-done',
        skipped: 'task-skipped',
        rescheduled: 'task-rescheduled',
        pending: '',
      }[status] || '';

      return `
        <div class="schedule-item ${rowClass}">
          <div class="time">${task.time}</div>
          <div class="schedule-body-grid">
            <div class="body">
              <div class="title-row">
                <span class="title">${task.title}</span>
                <span class="tag ${task.taskType}">${task.taskType}</span>
                <span class="tag ${task.priority}">${task.priority} priority</span>
                <span class="status-chip">${status}</span>
              </div>
              <div class="desc">${task.description}</div>
              <div class="desc" style="margin-top: 4px;">&#9201; ${task.duration} min - energy: ${task.energyRequired}</div>
              <div class="task-personalization">
                <strong>Why this appears:</strong> ${task.personalizationReason || fallbackTaskReason(task)}
              </div>
            </div>
            <div class="task-actions">
              ${statusButton(task.id, 'done', '&#9989; Done', status)}
              ${statusButton(task.id, 'skipped', '&#9197; Skip', status)}
              ${statusButton(task.id, 'rescheduled', '&#8635; Reschedule', status)}
            </div>
          </div>
        </div>
      `;
    }

    function statusButton(taskId, action, label, current) {
      const active = current === action ? 'active' : '';
      return `<button type="button" class="btn btn-outline ${action} ${active}" data-task-id="${taskId}" data-task-action="${action}">${label}</button>`;
    }

    function fallbackTaskReason(task) {
      return `This ${task.taskType} slot was chosen using your predicted energy, available hours, and recent productivity patterns.`;
    }

    function formatPercent(value) {
      return `${Number(value).toFixed(value % 1 === 0 ? 0 : 1)}%`;
    }
  </script>
</body>
</html>
