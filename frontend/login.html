<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in - TwinFlow</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <script src="/js/theme.js"></script>
</head>
<body>
  <div class="animated-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="shimmer-line"></div>
  </div>

  <div class="theme-toggle-corner">
    <button class="btn btn-outline btn-icon" onclick="toggleTheme()" title="Toggle theme">
      <span data-theme-icon>&#9782;</span>
    </button>
  </div>

  <div class="auth-wrapper">
    <div class="auth-card fade-in">
      <div class="auth-header">
        <div class="logo">&#9889;</div>
        <h1>TwinFlow</h1>
        <p>Your digital twin for peak productivity.</p>
      </div>
      <div class="card">
        <h2 style="margin-bottom: 4px;">Welcome back</h2>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">
          Sign in with your email or mobile number.
        </p>
        <div class="social-auth">
          <div id="google-login-button" class="google-signin-slot"></div>
          <p class="social-auth-hint" id="google-login-hint">
            Continue with Google if that is how you created your account.
          </p>
          <div class="social-divider"><span>or sign in with password</span></div>
        </div>
        <form id="login-form">
          <div class="form-group">
            <label for="identifier">Email or mobile number</label>
            <input
              type="text"
              id="identifier"
              autocomplete="username"
              required
              placeholder="you@example.com or 9876543210"
            />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input-wrap">
              <input
                type="password"
                id="password"
                autocomplete="current-password"
                required
                placeholder="********"
              />
              <button
                type="button"
                class="password-toggle"
                data-password-toggle
                aria-controls="password"
                aria-label="Show password"
                aria-pressed="false"
              >
                <span class="icon-stack" aria-hidden="true">
                  <svg class="toggle-icon icon-show" viewBox="0 0 24 24">
                    <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z" />
                    <circle cx="12" cy="12" r="2.8" />
                  </svg>
                  <svg class="toggle-icon icon-hide" viewBox="0 0 24 24">
                    <path d="M3 3l18 18" />
                    <path d="M10.6 5.2A11.4 11.4 0 0 1 12 5c6.4 0 10 7 10 7a18.4 18.4 0 0 1-3.2 3.9" />
                    <path d="M6.6 6.7C4 8.5 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.2-1.4" />
                    <path d="M9.9 9.9A3 3 0 0 0 14.1 14.1" />
                  </svg>
                </span>
                <span class="toggle-text">Show</span>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="captcha-answer">Captcha</label>
            <div class="captcha-wrap">
              <div class="captcha-display">
                <img id="captcha-image" alt="Login captcha challenge" />
              </div>
              <button type="button" class="captcha-refresh" id="captcha-refresh-btn" aria-label="Refresh captcha">
                <span class="captcha-refresh-icon" aria-hidden="true">&#10227;</span>
                <span>Refresh</span>
              </button>
            </div>
            <input
              type="text"
              id="captcha-answer"
              class="captcha-answer"
              autocomplete="off"
              inputmode="text"
              required
              minlength="4"
              maxlength="8"
              placeholder="Enter the captcha"
            />
            <small class="hint">Refresh it if the letters are hard to read.</small>
          </div>
          <div style="text-align: right; margin-bottom: 12px;">
            <a href="/forgot-password.html" style="font-size: 13px;">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-block" id="submit-btn">Sign in</button>
        </form>
        <div class="auth-footer">
          Don't have an account? <a href="/register.html">Create one</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/js/api.js"></script>
  <script src="/js/google-auth.js"></script>
  <script src="/js/password-toggle.js"></script>
  <script>
    const loginForm = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const captchaImage = document.getElementById('captcha-image');
    const captchaAnswer = document.getElementById('captcha-answer');
    const captchaRefreshBtn = document.getElementById('captcha-refresh-btn');

    window.twinFlowGoogleAuth.initGoogleButton({
      containerId: 'google-login-button',
      hintId: 'google-login-hint',
      loadingButtonId: 'submit-btn',
      loadingText: 'Opening Google...',
      text: 'continue_with',
      readyMessage: 'Use the same Google account you used for TwinFlow before.',
    });

    async function loadCaptcha() {
      captchaRefreshBtn.disabled = true;
      captchaRefreshBtn.classList.add('is-spinning');
      try {
        const res = await api.get(`/api/auth/captcha?ts=${Date.now()}`);
        captchaImage.src = res.imageData;
        captchaAnswer.value = '';
      } catch (err) {
        showToast(err.message || 'Could not load captcha', 'error');
      } finally {
        window.setTimeout(() => {
          captchaRefreshBtn.classList.remove('is-spinning');
        }, 180);
        captchaRefreshBtn.disabled = false;
      }
    }

    captchaRefreshBtn.addEventListener('click', async () => {
      await loadCaptcha();
      captchaAnswer.focus();
    });

    captchaAnswer.addEventListener('input', () => {
      captchaAnswer.value = captchaAnswer.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!captchaImage.src) {
        showToast('Captcha is still loading. Please wait a moment.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';
      try {
        await api.post('/api/auth/login', {
          identifier: document.getElementById('identifier').value.trim(),
          password: document.getElementById('password').value,
          captchaAnswer: captchaAnswer.value.trim(),
        });
        window.location.href = '/dashboard.html';
      } catch (err) {
        showToast(err.message || 'Login failed', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
        await loadCaptcha();
      }
    });

    loadCaptcha().catch(() => {
      showToast('Could not load captcha', 'error');
    });
  </script>
</body>
</html>
